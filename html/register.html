<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an Account · PV Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="auth-center">
  <div class="auth-center__inner">

    <div class="auth-logo">
      <span class="auth-logo__mark"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.7 6.02 6.55.63-4.93 4.37 1.42 6.43L12 16.6l-5.74 3.35 1.42-6.43L2.75 9.15l6.55-.63L12 2.5z"/></svg></span></span>
      <span class="auth-logo__name">PV Solution</span>
    </div>

    <div class="auth-card">
      <h1 class="h2">Create an Account</h1>
      <p class="auth-card__sub">Register as a new PV Solution customer</p>

      <form action="login.html">
        <div class="col">
          <div class="field">
            <label class="field__label" for="fullname">Full Name</label>
            <input class="input" id="fullname" name="fullname" type="text" placeholder="Enter your full name">
          </div>
        </div>

        <div class="pair">
          <div class="field">
            <label class="field__label" for="phone">Phone Number</label>
            <input class="input" id="phone" name="phone" type="tel" placeholder="0812-xxxx-xxxx">
          </div>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" placeholder="you@email.com">
          </div>
        </div>

        <div class="col">
          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="input-group"><input class="input" id="password" name="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password"><button class="input-group__btn" type="button" data-toggle-password aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                <path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.1M6.6 6.6A18 18 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"></path><path d="m2 2 20 20"></path>
              </svg>
            </button></div>
          </div>
        </div>

        <div class="col">
          <div class="field">
            <label class="field__label" for="confirm">Confirm Password</label>
            <div class="input-group"><input class="input" id="confirm" name="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password"><button class="input-group__btn" type="button" data-toggle-password aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
                <path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.1M6.6 6.6A18 18 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"></path><path d="m2 2 20 20"></path>
              </svg>
            </button></div>
          </div>
        </div>

        <div>
          <div class="checkline">
            <input id="terms" name="terms" type="checkbox">
            <label class="muted-600" for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label>
          </div>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Create Account</button>
      </form>

      <p class="auth-card__foot">Already have an account? <a href="login.html">Sign in</a></p>
    </div>

  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
